<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Achadinhos Gamer &amp; GTA 6 🎮🔥 — Link Oficial da Bio</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #151c2c;
      --border: #26324d;
      --brand: #0ea5e9;
      --shopee: #ee4d2d;
      --text: #ffffff;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(circle at top, #0f2942 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 14px 60px;
    }
    .wrap { max-width: 520px; margin: 0 auto; }
    .profile { text-align: center; margin-bottom: 20px; }
    .avatar {
      width: 84px; height: 84px; border-radius: 50%; margin: 0 auto 10px;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      display: flex; align-items: center; justify-content: center;
      font-size: 38px; box-shadow: 0 8px 25px rgba(14, 165, 233, 0.45);
      border: 3px solid rgba(255,255,255,0.35);
    }
    .profile h1 { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
    .profile p { font-size: 13.5px; color: #cbd5e1; line-height: 1.45; }
    .search-box {
      background: var(--card); border: 2px solid var(--brand);
      border-radius: 16px; padding: 14px; margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.45);
    }
    .search-label {
      font-size: 12px; font-weight: 800; color: #7dd3fc;
      text-transform: uppercase; letter-spacing: 0.5px;
      margin-bottom: 8px; display: block; text-align: center;
    }
    .search-row { display: flex; gap: 8px; }
    .search-row input {
      flex: 1; background: #090d16; border: 1px solid var(--border);
      color: #fff; padding: 13px 14px; border-radius: 12px;
      font-size: 16px; font-weight: 700; text-align: center; outline: none;
    }
    .search-row button {
      background: linear-gradient(135deg, var(--shopee), #ff7337);
      border: none; color: #fff; font-weight: 800; font-size: 13px;
      padding: 0 18px; border-radius: 12px; cursor: pointer;
    }
    .list { display: flex; flex-direction: column; gap: 11px; }
    .item {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 11px 12px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; text-decoration: none; color: #fff;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .item:hover { transform: translateY(-2px); border-color: var(--brand); }
    .thumb-wrap {
      position: relative; width: 58px; height: 74px; border-radius: 10px;
      overflow: hidden; background: #090d16; flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.12);
    }
    .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .code-badge {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: rgba(238, 77, 45, 0.95); color: #fff;
      font-weight: 900; font-size: 11px; text-align: center; padding: 2px 0;
    }
    .item-info { flex: 1; min-width: 0; }
    .item-title { font-size: 14.5px; font-weight: 700; margin-bottom: 4px; line-height: 1.3; }
    .item-sub { font-size: 12px; color: var(--muted); }
    .cta-btn {
      background: linear-gradient(135deg, var(--shopee), #ff6b4a);
      color: #fff; font-weight: 800; font-size: 11.5px;
      padding: 10px 12px; border-radius: 10px; white-space: nowrap;
      box-shadow: 0 4px 12px rgba(238, 77, 45, 0.3);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="profile">
      <div class="avatar">🎮</div>
      <h1>Achadinhos Gamer &amp; GTA 6 🎮🔥</h1>
      <p>Curtiu o corte? Digite abaixo o código do produto que você viu no vídeo para abrir direto na Shopee com desconto!</p>
    </div>

    <div class="search-box">
      <span class="search-label">👇 Digite o Código do Vídeo (Ex: 001, 002...)</span>
      <form class="search-row" onsubmit="goDirect(event)">
        <input id="codeInput" type="text" placeholder="Ex: 001 ou nome do produto..." oninput="filterList()" />
        <button type="submit">ABRIR ➔</button>
      </form>
    </div>

    <div id="catalogList" class="list"></div>
  </div>

  <script>
    const allProducts = [{"code":"001","productNamePt":"Camiseta Oversized Vice City GTA 6 (Algodão Premium)","category":"GTA 6 & Gamer","estimatedPriceBr":"50% OFF na Shopee","targetUrl":"https://s.shopee.com.br/an_redir?origin_link=https%3A%2F%2Fshopee.com.br%2Fsearch%3Fkeyword%3Dcamiseta%2520gta%25206%2520vice%2520city&affiliate_id=18397081354&sub_id=vitrine_001","thumb":"thumbs/001.jpg"},{"code":"002","productNamePt":"Luminária LED Neon Vice City GTA 6 (Setup Gamer)","category":"GTA 6 & Gamer","estimatedPriceBr":"Achadinho Gamer","targetUrl":"https://s.shopee.com.br/an_redir?origin_link=https%3A%2F%2Fshopee.com.br%2Fsearch%3Fkeyword%3Dluminaria%2520neon%2520vice%2520city%2520gta&affiliate_id=18397081354&sub_id=vitrine_002","thumb":"thumbs/002.jpg"},{"code":"003","productNamePt":"Mousepad Gamer XXL Vice City GTA 6 (90x40cm)","category":"GTA 6 & Gamer","estimatedPriceBr":"60% OFF na Shopee","targetUrl":"https://s.shopee.com.br/an_redir?origin_link=https%3A%2F%2Fshopee.com.br%2Fsearch%3Fkeyword%3Dmousepad%2520gamer%2520grande%2520gta%2520vice%2520city&affiliate_id=18397081354&sub_id=vitrine_003","thumb":"thumbs/003.jpg"}];

    function renderCatalog(items) {
      const el = document.getElementById('catalogList');
      if (items.length === 0) {
        el.innerHTML = '<div style="text-align:center;color:var(--muted);padding:30px;">Nenhum produto encontrado com esse código.</div>';
        return;
      }
      el.innerHTML = items.map(p => `
        <a class="item" href="${p.targetUrl}" target="_blank" rel="noopener">
          <div class="thumb-wrap">
            <img src="${p.thumb}" alt="#${p.code}" onerror="this.style.display='none'" />
            <div class="code-badge">#${p.code}</div>
          </div>
          <div class="item-info">
            <div class="item-title">#${p.code} — ${p.productNamePt}</div>
            <div class="item-sub">💰 ${p.estimatedPriceBr} • ${p.category}</div>
          </div>
          <div class="cta-btn">VER NA SHOPEE ➔</div>
        </a>
      `).join('');
    }

    function filterList() {
      const q = document.getElementById('codeInput').value.trim().toLowerCase();
      if (!q) { renderCatalog(allProducts); return; }
      const numClean = q.replace(/\D/g, '');
      const filtered = allProducts.filter(p =>
        p.code.includes(numClean && numClean.length > 0 ? numClean : '___') ||
        p.productNamePt.toLowerCase().includes(q) ||
        (p.category || '').toLowerCase().includes(q)
      );
      renderCatalog(filtered);
    }

    function goDirect(e) {
      e.preventDefault();
      const q = document.getElementById('codeInput').value.trim();
      if (!q) return;
      const digits = q.replace(/\D/g, '');
      if (digits) {
        const padded = digits.padStart(3, '0');
        const match = allProducts.find(p => p.code === padded);
        if (match) { window.open(match.targetUrl, '_blank'); return; }
      }
      filterList();
    }

    renderCatalog(allProducts);
  </script>
</body>
</html>
